<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 16px;
      background: #ffffff;
    }

    h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #000;
    }

    .section {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #333;
    }

    input[type="file"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
    }

    .info {
      background: #f5f5f7;
      padding: 12px;
      border-radius: 6px;
      font-size: 11px;
      color: #666;
      margin-bottom: 16px;
    }

    .info strong {
      color: #000;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #0071e3;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #0077ed;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }

    .status.info {
      background: #d1ecf1;
      color: #0c5460;
      display: block;
    }

    .progress {
      margin-top: 12px;
      display: none;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: #e0e0e0;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #0071e3;
      transition: width 0.3s;
      width: 0%;
    }

    .progress-text {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>Import T3000 Deck</h2>

  <div class="info">
    <strong>📋 Instructions:</strong><br>
    1. Export your deck using: <code>node figma-export.js</code><br>
    2. Select the generated <code>figma-export.json</code> file<br>
    3. Click "Import to Figma"
  </div>

  <div class="section">
    <label for="fileInput">Select figma-export.json:</label>
    <input type="file" id="fileInput" accept=".json" />
  </div>

  <button id="importBtn" disabled>Import to Figma</button>

  <div class="progress" id="progress">
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-text" id="progressText">Importing...</div>
  </div>

  <div class="status" id="status"></div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const importBtn = document.getElementById('importBtn');
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');

    let exportData = null;

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          exportData = JSON.parse(event.target.result);

          // Validate structure
          if (!exportData.frames || !Array.isArray(exportData.frames)) {
            throw new Error('Invalid export file: missing frames array');
          }

          importBtn.disabled = false;
          showStatus('success', `✅ Loaded ${exportData.frames.length} slides from ${exportData.meta?.source || 'deck'}`);
        } catch (err) {
          showStatus('error', `❌ Error parsing file: ${err.message}`);
          exportData = null;
          importBtn.disabled = true;
        }
      };
      reader.readAsText(file);
    });

    importBtn.addEventListener('click', () => {
      if (!exportData) return;

      importBtn.disabled = true;
      showProgress(true);

      // Send to plugin code
      parent.postMessage({
        pluginMessage: {
          type: 'import',
          data: exportData
        }
      }, '*');
    });

    // Listen for messages from plugin code
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;

      if (msg.type === 'progress') {
        updateProgress(msg.percent, msg.message);
      } else if (msg.type === 'complete') {
        showProgress(false);
        showStatus('success', `✅ Import complete! Created ${msg.count} slides.`);
        importBtn.disabled = false;
      } else if (msg.type === 'error') {
        showProgress(false);
        showStatus('error', `❌ Import failed: ${msg.message}`);
        importBtn.disabled = false;
      }
    };

    function showStatus(type, message) {
      status.className = `status ${type}`;
      status.textContent = message;
    }

    function showProgress(visible) {
      progress.style.display = visible ? 'block' : 'none';
      if (!visible) {
        progressFill.style.width = '0%';
      }
    }

    function updateProgress(percent, message) {
      progressFill.style.width = `${percent}%`;
      progressText.textContent = message || `Importing... ${Math.round(percent)}%`;
    }
  </script>
</body>
</html>
